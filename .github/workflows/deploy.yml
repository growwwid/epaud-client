name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: growwwid/epaud-client

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          TAG: ${{ needs.build.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          envs: DEPLOY_PATH,TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            sed -i "s|^WEB_TAG=.*|WEB_TAG=${TAG}|" .env
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml up -d web
            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
                echo "web ready (tag ${TAG})"; exit 0
              fi
              sleep 2
            done
            echo "web tidak siap setelah 90s"
            docker compose -f docker-compose.prod.yml logs --tail=50 web
            exit 1

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.deploy.result }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Telegram tidak dikonfigurasi, lewati."; exit 0
          fi
          if [ "$STATUS" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          TEXT="${ICON} Deploy *epaud-client* ${STATUS}%0Atag: \`${TAG}\`%0A${{ github.repository }}@${{ github.sha }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" -d "parse_mode=Markdown" -d "text=${TEXT}"
