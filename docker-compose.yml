services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: epaud-client:latest
    environment:
      # URL API ePAUD dari dalam container. Ganti bila API berjalan di host lain.
      EPAUD_API_URL: ${EPAUD_API_URL:-http://host.docker.internal:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Agar "host.docker.internal" menunjuk ke host (berguna di Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
